<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adiviná qué piloto de Turismo Carretera conduce el auto del día.">
    <title>TCdle | Adiviná el piloto por su auto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&amp;family=Saira+Condensed:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/juego-compartido.css?v=1">
    <link rel="stylesheet" href="../assets/css/adivinar-el-auto.css?v=18">
</head>
<body>
    <header class="encabezado-juego">
        <a href="../index.html" aria-label="Volver al juego principal">
            <img class="logo-juego" src="../assets/images/tcdle-logo.png" alt="TCdle">
        </a>
    </header>

    <main class="juego juego--auto">
        <section class="presentacion-juego" aria-labelledby="titulo-auto">
            <p class="modo-juego">Modo auto</p>
            <h1 id="titulo-auto">¿Quién maneja este TC?</h1>
            <p>La imagen se vuelve más nítida después de cada intento.</p>
        </section>

        <section class="tarjeta-desafio tarjeta-auto" aria-label="Auto del día">
            <div class="marco-auto">
                <img id="foto-auto" src="" alt="Auto de Turismo Carretera desenfocado">
                <div id="niveles-desenfoque" class="niveles-desenfoque" aria-hidden="true"></div>
            </div>
            <div class="estado-diario">
                <p id="intentos-restantes-auto" class="contador-intentos">8 intentos disponibles</p>
                <div id="estado-final" class="estado-final" tabindex="-1" hidden>
                    <span id="estado-final-etiqueta"></span>
                    <strong id="estado-final-piloto"></strong>
                </div>
                <p id="regreso-auto" class="cuenta-regresiva" hidden>
                    <span>Próximo piloto en:</span>
                    <strong id="tiempo-nuevo-auto">--:--:--</strong>
                </p>
            </div>
        </section>

        <section id="panel-intento-auto" class="panel-intento" aria-labelledby="titulo-intento-auto">
            <div class="panel-intento__cabecera">
                <strong id="numero-intento-auto" class="panel-intento__numero">01</strong>
                <div>
                    <p>Reconocé el auto</p>
                    <h2 id="titulo-intento-auto">Elegí un piloto</h2>
                </div>
            </div>

            <div class="panel-intento__contenido">
                <div class="fila-busqueda">
                    <div class="buscador">
                        <label class="solo-lectores" for="nombre-piloto-auto">Nombre del piloto</label>
                        <input id="nombre-piloto-auto" type="text" placeholder="Adiviná el piloto del auto" autocomplete="off">
                        <div id="sugerencias-auto" class="buscador__sugerencias" role="listbox" hidden></div>
                    </div>
                    <button id="boton-intentar-auto" class="boton-intentar" type="button">Intentar</button>
                </div>
                <p id="mensaje-auto" class="mensaje-juego" aria-live="polite"></p>
            </div>
        </section>

        <section id="historial-auto" class="historial-intentos" aria-labelledby="titulo-historial-auto" hidden>
            <div class="titulo-seccion">
                <span></span>
                <h2 id="titulo-historial-auto">Intentos</h2>
            </div>
            <div id="lista-intentos-auto" class="lista-intentos"></div>
        </section>
    </main>

    <dialog
        id="resultado-auto-modal"
        class="resultado-modal resultado-auto-modal"
        aria-labelledby="titulo-resultado-auto-modal"
        aria-describedby="detalle-resultado-auto-modal"
    >
        <div class="resultado-modal__contenido resultado-auto-modal__contenido">
            <button
                id="cerrar-resultado-auto-modal"
                class="resultado-modal__cerrar resultado-auto-modal__cerrar"
                type="button"
                aria-label="Cerrar resultado"
            >×</button>
            <p class="resultado-modal__etiqueta">Bandera a cuadros</p>
            <h2 id="titulo-resultado-auto-modal"></h2>
            <img id="foto-resultado-auto-modal" class="resultado-auto-modal__foto" src="" alt="">
            <strong id="piloto-resultado-auto-modal" class="resultado-modal__nombre"></strong>
            <p id="detalle-resultado-auto-modal" class="resultado-modal__detalle"></p>
            <p class="resultado-modal__regreso">
                <span>Nuevo auto en:</span>
                <strong id="tiempo-nuevo-auto-modal">--:--:--</strong>
            </p>
        </div>
    </dialog>

    <script src="../assets/js/pilotos.js"></script>
    <script src="../assets/js/autos.js?v=1"></script>
    <script src="../assets/js/tcdle.js?v=1"></script>
    <script src="../assets/js/seleccion-diaria.js?v=1"></script>
    <script src="../assets/js/adivinar-el-auto.js?v=20"></script>
</body>
</html>
