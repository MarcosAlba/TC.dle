<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adiviná la palabra de Turismo Carretera del día, estilo Wordle.">
    <title>TCdle | Wordle del TC (versión original)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&amp;family=Saira+Condensed:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/juego-compartido.css?v=1">
    <link rel="stylesheet" href="../assets/css/tcdle-wordle-original.css?v=1">
</head>
<body>
    <header class="encabezado-juego">
        <a href="../index.html" aria-label="Volver al inicio">
            <img class="logo-juego" src="../assets/images/tcdle-logo.png" alt="TCdle">
        </a>
    </header>

    <main class="juego juego--wordle">
        <section class="presentacion-juego" aria-labelledby="titulo-wordle">
            <p class="modo-juego">Wordle del TC</p>
            <h1 id="titulo-wordle">Adiviná la palabra de hoy</h1>
            <p>Escribí con tu teclado o tocá el teclado de abajo.</p>
            <a class="cambiar-version-wordle" href="tcdle-wordle.html">Versión original · ver rediseño →</a>
        </section>

        <section class="tarjeta-desafio tarjeta-wordle" aria-label="Tablero del día">
            <div id="tablero-wordle" class="tablero-wordle" role="group" aria-label="Tablero de letras"></div>
            <div class="estado-diario">
                <p id="intentos-restantes-wordle" class="contador-intentos solo-lectores">Intentos disponibles</p>
                <p id="regreso-wordle" class="cuenta-regresiva" hidden>
                    <span>Nueva palabra en:</span>
                    <strong id="tiempo-nueva-palabra">--:--:--</strong>
                </p>
            </div>
        </section>

        <p id="mensaje-wordle" class="mensaje-juego mensaje-wordle" aria-live="polite"></p>

        <section id="teclado-virtual" class="teclado-virtual" aria-label="Teclado virtual"></section>
    </main>

    <dialog
        id="resultado-wordle-modal"
        class="resultado-modal resultado-wordle-modal"
        aria-labelledby="titulo-resultado-wordle-modal"
        aria-describedby="detalle-resultado-wordle-modal"
    >
        <div class="resultado-modal__contenido">
            <button
                id="cerrar-resultado-wordle-modal"
                class="resultado-modal__cerrar"
                type="button"
                aria-label="Cerrar resultado"
            >×</button>
            <p class="resultado-modal__etiqueta">Bandera a cuadros</p>
            <h2 id="titulo-resultado-wordle-modal"></h2>
            <strong id="palabra-resultado-wordle-modal" class="resultado-modal__nombre"></strong>
            <p id="detalle-resultado-wordle-modal" class="resultado-modal__detalle"></p>
            <p class="resultado-modal__regreso">
                <span>Nueva palabra en:</span>
                <strong id="tiempo-nueva-palabra-modal">--:--:--</strong>
            </p>
        </div>
    </dialog>

    <script src="../assets/js/palabras-tc.js"></script>
    <script src="../assets/js/tcdle.js?v=1"></script>
    <script src="../assets/js/seleccion-diaria.js?v=1"></script>
    <script src="../assets/js/tcdle-wordle-original.js?v=1"></script>
</body>
</html>
