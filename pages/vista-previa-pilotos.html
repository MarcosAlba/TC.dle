<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Herramienta interna para revisar las fotos de pilotos antes de cargarlas al juego.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/juego-compartido.css?v=15">
    <link rel="stylesheet" href="../assets/css/estilos.css?v=13">
    <link rel="stylesheet" href="../assets/css/vista-previa-pilotos.css?v=1">
    <title>TCdle | Vista previa de pilotos</title>
    <link rel="icon" type="image/png" href="../assets/images/tc-dle.ico">
    <script src="../assets/js/tcdle.js?v=5"></script>
</head>
<body>
    <header class="encabezado-juego">
        <a href="../index.html" aria-label="Volver al inicio">
            <img src="../assets/images/tcdle-logo.png" alt="TCdle" class="logo-juego">
        </a>
    </header>

    <main class="juego juego--piloto">
        <section class="presentacion-juego" aria-labelledby="titulo-vista-previa">
            <p class="modo-juego">Herramienta de carga</p>
            <h1 id="titulo-vista-previa">Vista previa de pilotos</h1>
        </section>

        <section class="panel-intento" aria-labelledby="titulo-buscador-vista-previa">
            <h2 id="titulo-buscador-vista-previa" class="solo-lectores">Elegí un piloto</h2>

            <div class="panel-intento__contenido">
                <div class="fila-busqueda">
                    <div class="buscador">
                        <label class="solo-lectores" for="buscar-piloto">Nombre del piloto</label>
                        <input id="buscar-piloto" type="text" placeholder="Buscá un piloto o apodo" autocomplete="off">
                        <div id="sugerencias-vista-previa" class="buscador__sugerencias" role="listbox" hidden></div>
                    </div>
                </div>

                <div class="controles-vista-previa">
                    <button id="anterior-vista-previa" class="boton-vista-previa-secundario" type="button">◀ Anterior</button>
                    <button id="siguiente-vista-previa" class="boton-vista-previa-secundario" type="button">Siguiente ▶</button>
                    <label class="filtro-vista-previa">
                        <input id="solo-leyendas" type="checkbox" checked>
                        Solo leyendas
                    </label>
                </div>
                <p id="estado-vista-previa" class="contador-intentos estado-vista-previa" aria-live="polite"></p>
            </div>
        </section>

        <section class="seccion-vista-previa" aria-labelledby="titulo-muestra-buscador">
            <div class="titulo-seccion">
                <span></span>
                <h2 id="titulo-muestra-buscador">En el buscador</h2>
            </div>
            <div class="muestra-buscador">
                <div id="muestra-buscador" class="buscador__sugerencias"></div>
            </div>
        </section>

        <section class="seccion-vista-previa panel-intentos" aria-labelledby="titulo-muestra-tabla">
            <div class="titulo-seccion">
                <span></span>
                <h2 id="titulo-muestra-tabla">En la tabla de intentos</h2>
            </div>

            <p class="etiqueta-vista-previa">Cuando lo adivinás</p>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Modelo</th>
                        <th>Equipo</th>
                        <th>Localidad</th>
                        <th>Campeón de TC</th>
                        <th>Edad</th>
                        <th>Año de debut</th>
                    </tr>
                </thead>
                <tbody id="fila-acierto"></tbody>
            </table>

            <p class="etiqueta-vista-previa">Cuando le errás</p>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Modelo</th>
                        <th>Equipo</th>
                        <th>Localidad</th>
                        <th>Campeón de TC</th>
                        <th>Edad</th>
                        <th>Año de debut</th>
                    </tr>
                </thead>
                <tbody id="fila-error"></tbody>
            </table>
        </section>

        <section class="seccion-vista-previa" aria-labelledby="titulo-muestra-resultado">
            <div class="titulo-seccion">
                <span></span>
                <h2 id="titulo-muestra-resultado">En el resultado</h2>
            </div>
            <div id="muestra-resultados" class="muestra-resultados"></div>
        </section>
    </main>

    <script src="../assets/js/pilotos.js?v=2"></script>
    <script src="../assets/js/vista-previa-pilotos.js?v=1"></script>
</body>
</html>
