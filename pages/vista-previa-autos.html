<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Herramienta interna para revisar las fotos de autos antes de cargarlas al juego.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Work+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/juego-compartido.css?v=2">
    <link rel="stylesheet" href="../assets/css/adivinar-el-auto.css?v=22">
    <link rel="stylesheet" href="../assets/css/vista-previa-autos.css?v=1">
    <title>TCdle | Vista previa de autos</title>
    <link rel="icon" type="image/png" href="../assets/images/tc-dle.ico">
    <script src="../assets/js/tcdle.js?v=3"></script>
</head>
<body>
    <header class="encabezado-juego">
        <a href="../index.html" aria-label="Volver al juego principal">
            <img class="logo-juego" src="../assets/images/tcdle-logo.png" alt="TCdle">
        </a>
    </header>

    <main class="juego juego--auto">
        <section class="presentacion-juego" aria-labelledby="titulo-vista-previa">
            <p class="modo-juego">Herramienta de carga</p>
            <h1 id="titulo-vista-previa">Vista previa de autos</h1>
            <p>Buscá un piloto para revisar su foto antes de cargarla al juego. Si tiene más de un año cargado, el buscador te muestra cada uno por separado.</p>
        </section>

        <section class="tarjeta-desafio tarjeta-auto" aria-label="Foto seleccionada">
            <div id="marco-vista-previa" class="marco-auto">
                <img id="foto-vista-previa" src="" alt="" hidden>
                <p id="vacio-vista-previa">La foto seleccionada aparece acá.</p>
            </div>
            <div class="estado-diario">
                <p id="estado-vista-previa" class="contador-intentos" aria-live="polite">Elegí un auto para verlo.</p>
            </div>
        </section>

        <section class="panel-intento" aria-labelledby="titulo-buscador-vista-previa">
            <div class="panel-intento__cabecera">
                <div>
                    <p>Catálogo de autos</p>
                    <h2 id="titulo-buscador-vista-previa">Buscá un piloto</h2>
                </div>
            </div>

            <div class="panel-intento__contenido">
                <div class="fila-busqueda">
                    <div class="buscador">
                        <label class="solo-lectores" for="buscar-auto">Nombre del piloto</label>
                        <input id="buscar-auto" type="text" placeholder="Escribí el nombre del piloto" autocomplete="off">
                        <div id="sugerencias-vista-previa" class="buscador__sugerencias" role="listbox" hidden></div>
                    </div>
                </div>

                <div class="controles-vista-previa">
                    <button id="aplicar-blur-vista-previa" class="boton-intentar" type="button" disabled>Aplicar blur original</button>
                    <button id="quitar-blur-vista-previa" class="boton-vista-previa-secundario" type="button" disabled>Quitar blur</button>
                </div>
            </div>
        </section>
    </main>

    <script src="../assets/js/pilotos.js"></script>
    <script src="../assets/js/autos.js?v=2"></script>
    <script src="../assets/js/vista-previa-autos.js?v=1"></script>
</body>
</html>
