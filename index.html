<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elegí uno de los tres desafíos diarios de TCdle.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/inicio.css?v=9">
    <title>TCdle</title>
    <link rel="icon" type="image/x-icon" href="assets/images/tc-dle.ico">
</head>
<body>
    <header class="encabezado-inicio">
        <img class="logo-inicio" src="assets/images/tcdle-logo-frenada.svg" alt="TCdle" width="1570" height="384">
    </header>

    <main class="inicio">
        <section class="selector-juegos" aria-labelledby="titulo-selector">
            <h1 id="titulo-selector">Elegí un juego</h1>

            <div class="grilla-juegos">
                <a class="tarjeta-juego tarjeta-juego--piloto" href="pages/adivinar-el-piloto.html">
                    <span class="tarjeta-juego__imagen">
                        <img src="assets/images/pilotos/julian_santero.png" alt="Julián Santero">
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong class="tarjeta-juego__nombre">Adiviná el piloto</strong>
                        <span class="tarjeta-juego__jugar" aria-hidden="true">Jugar</span>
                    </span>
                </a>

                <a class="tarjeta-juego tarjeta-juego--auto" href="pages/adivinar-el-auto.html">
                    <span class="tarjeta-juego__imagen">
                        <img src="assets/images/autos/agustin_canapino_2026.webp" alt="Auto de Agustín Canapino">
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong class="tarjeta-juego__nombre">Adiviná el auto</strong>
                        <span class="tarjeta-juego__jugar" aria-hidden="true">Jugar</span>
                    </span>
                </a>

                <a class="tarjeta-juego tarjeta-juego--circuito" href="pages/adivinar-el-circuito.html">
                    <span class="tarjeta-juego__imagen">
                        <img src="assets/images/circuitos/buenos-aires-12-sin-chicana.svg" alt="Silueta del Autódromo Oscar Cabalén">
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong class="tarjeta-juego__nombre">Adiviná el circuito</strong>
                        <span class="tarjeta-juego__jugar" aria-hidden="true">Jugar</span>
                    </span>
                </a>

                <a class="tarjeta-juego tarjeta-juego--wordle" href="pages/tcdle-wordle.html">
                    <span class="tarjeta-juego__imagen">
                        <span class="tarjeta-juego__letras" aria-hidden="true">
                            <span>T</span><span>C</span><span>D</span><span>L</span><span>E</span>
                        </span>
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong class="tarjeta-juego__nombre">Wordle del TC</strong>
                        <span class="tarjeta-juego__jugar" aria-hidden="true">Jugar</span>
                    </span>
                </a>
            </div>
        </section>

        <section id="proxima-carrera" class="proxima-carrera" hidden>
            <img id="proxima-carrera-trazado" class="proxima-carrera__trazado" src="" alt="">
            <p class="proxima-carrera__titulo" aria-hidden="true">
                <span id="proxima-carrera-fecha" class="proxima-carrera__fecha"></span>
                <span id="proxima-carrera-lugar" class="proxima-carrera__lugar"></span>
            </p>
            <div class="proxima-carrera__reloj" aria-hidden="true">
                <span class="proxima-carrera__tile"><b id="proxima-carrera-dias">00</b><small>días</small></span>
                <span class="proxima-carrera__tile"><b id="proxima-carrera-horas">00</b><small>horas</small></span>
                <span class="proxima-carrera__tile"><b id="proxima-carrera-minutos">00</b><small>min</small></span>
                <span class="proxima-carrera__tile proxima-carrera__tile--segundos"><b id="proxima-carrera-segundos">00</b><small>seg</small></span>
            </div>
        </section>
    </main>

    <script src="assets/js/calendario.js?v=1"></script>
    <script src="assets/js/inicio.js?v=2"></script>
</body>
</html>
