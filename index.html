<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elegí uno de los tres desafíos diarios de TCdle.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Work+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/inicio.css?v=3">
    <title>TCdle | Juegos diarios de Turismo Carretera</title>
    <link rel="icon" type="image/x-icon" href="assets/images/tc-dle.ico">
</head>
<body>
    <header class="encabezado-inicio">
        <img class="logo-inicio" src="assets/images/tcdle-logo.png" alt="TCdle">

        <div class="redes-inicio" aria-label="Próximamente en redes sociales">
            <span class="red-social" role="img" aria-label="Instagram, próximamente">
                <img src="assets/images/iconos/instagram.svg" alt="">
            </span>
            <span class="red-social" role="img" aria-label="X, próximamente">
                <img src="assets/images/iconos/x.svg" alt="">
            </span>
        </div>
    </header>

    <main class="inicio">
        <p class="aviso-redes">
            Próximamente encontranos en <strong>Instagram</strong> y <strong>X</strong>.
        </p>

        <section class="selector-juegos" aria-labelledby="titulo-selector">
            <p class="selector-juegos__eyebrow">Cuatro desafíos diarios</p>
            <h1 id="titulo-selector">Selecciona un juego:</h1>

            <div class="grilla-juegos">
                <a class="tarjeta-juego tarjeta-juego--piloto" href="pages/adivinar-el-piloto.html">
                    <span class="tarjeta-juego__imagen">
                        <img src="assets/images/pilotos/julian_santero.png" alt="Julián Santero">
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong>Jugar</strong>
                        <span>Adiviná el piloto</span>
                    </span>
                </a>

                <a class="tarjeta-juego tarjeta-juego--auto" href="pages/adivinar-el-auto.html">
                    <span class="tarjeta-juego__imagen">
                        <img src="assets/images/autos/agustin_canapino_2026.webp" alt="Auto de Agustín Canapino">
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong>Jugar</strong>
                        <span>Adiviná el auto</span>
                    </span>
                </a>

                <a class="tarjeta-juego tarjeta-juego--circuito" href="pages/adivinar-el-circuito.html">
                    <span class="tarjeta-juego__imagen">
                        <img src="assets/images/circuitos/buenos-aires-12-sin-chicana.svg" alt="Silueta del Autódromo Oscar Cabalén">
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong>Jugar</strong>
                        <span>Adiviná el circuito</span>
                    </span>
                </a>

                <a class="tarjeta-juego tarjeta-juego--wordle" href="pages/tcdle-wordle.html">
                    <span class="tarjeta-juego__imagen">
                        <span class="tarjeta-juego__letras" aria-hidden="true">
                            <span>T</span><span>C</span><span>D</span><span>L</span><span>E</span>
                        </span>
                    </span>
                    <span class="tarjeta-juego__contenido">
                        <strong>Jugar</strong>
                        <span>Wordle del TC</span>
                    </span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
