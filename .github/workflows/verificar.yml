# Corre los tests, los tipos y el build en cada push y pull request para avisar
# si algo se rompe antes de que Vercel publique. No publica nada: el sitio lo
# despliega Vercel desde main (ver README).
name: Verificar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
